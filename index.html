<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0908" />

    <title>Linked Out 2.0 — AIESEC Global Talent Program</title>
    <meta
      name="description"
      content="A global professional micro-event by AIESEC connecting ambitious young professionals aged 18–30 with real international opportunities, mentors and industry leaders. 03 May 2026, Tunis."
    />

    <!-- Open Graph / social cards. Drop og-image.png (1200×630) into /public
         and this works everywhere the link gets shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Linked Out 2.0" />
    <meta property="og:title" content="Linked Out 2.0 — Go Beyond Borders" />
    <meta
      property="og:description"
      content="AIESEC Global Talent Program · 03 May 2026 · Tunis. Real international opportunities, mentors and industry leaders. Free to attend."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Linked Out 2.0 — Go Beyond Borders" />
    <meta
      name="twitter:description"
      content="AIESEC Global Talent Program · 03 May 2026 · Tunis. Free to attend."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Hadrumet mark. The source art is white on transparent, which would
         disappear against a light browser tab, so it is composited onto
         the brand plate. Generated from src/assets/hadrumet.png. -->
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Paint the brand background before the stylesheet resolves, so the
         preloader never flashes white. -->
    <style>
      html, body { background: #0C0908; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
